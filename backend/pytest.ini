[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -ra --strict-markers
markers =
    postgres: requiere PostgreSQL real (defina TEST_DATABASE_URL); concurrencia, índices parciales, triggers y migraciones
filterwarnings =
    ignore::DeprecationWarning:slowapi.*
    ignore::DeprecationWarning:asyncio.*
