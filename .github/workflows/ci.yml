name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pruebas con PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas con SQLite (rápidas)
        run: python -m pytest -q
      - name: Pruebas con PostgreSQL (concurrencia, migraciones desde cero, índices parciales)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/inventia_test
        run: python -m pytest -q --cov=app --cov-report=term

  frontend:
    name: Frontend (lint, tipos, pruebas, compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contrato:
    name: Los tipos del frontend coinciden con la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements.txt
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm --prefix frontend run tipos
      - name: Verificar que no hay cambios sin confirmar
        run: git diff --exit-code -- frontend/src/types/api.gen.ts

  seguridad:
    name: Revisión de seguridad (informativa)
    runs-on: ubuntu-latest
    # No bloquea la integración: un aviso nuevo en una dependencia no debe impedir un cambio ajeno. Se revisa el resultado.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de Python con vulnerabilidades conocidas (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off
      - name: Dependencias de Node en producción con vulnerabilidades conocidas (npm audit)
        run: npm --prefix frontend audit --omit=dev --audit-level=moderate
      - name: Análisis estático del código del backend (Bandit)
        run: |
          pip install bandit
          bandit -r backend/app -q

  imagenes:
    name: Las imágenes de Docker se construyen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
