# Inventia — despliegue completo con Docker Compose: PostgreSQL + API + interfaz web.
#
#   cp infra/.env.example infra/.env        # y complete los valores marcados como obligatorios
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#
# La interfaz queda en http://localhost:${WEB_PORT:-8080}. Al arrancar, el backend aplica las migraciones.
# Datos de demostración (opcional, solo en una base vacía):
#   docker compose -f infra/docker-compose.yml --env-file infra/.env --profile demo run --rm demo
#
# Solo la base de datos, para desarrollar con el backend y el frontend en su máquina:
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d db

name: inventia

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventia}
      POSTGRES_USER: ${POSTGRES_USER:-inventia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en infra/.env}
      TZ: UTC
    volumes:
      - inventia_datos:/var/lib/postgresql/data
    ports:
      # Solo accesible desde la propia máquina (nunca expuesto a la red).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ../backend
    image: inventia-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-inventia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventia}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY (mínimo 32 caracteres) en infra/.env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Defina SETUP_TOKEN (mínimo 16 caracteres) en infra/.env}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY_HEADERS: "true"
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ../frontend
    image: inventia-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3

  # Carga una empresa ficticia con historial de ventas para conocer el sistema. Solo si se pide el perfil «demo».
  demo:
    profiles: ["demo"]
    image: inventia-backend:latest
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-inventia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-inventia}
      SECRET_KEY: ${SECRET_KEY}
      SETUP_TOKEN: ${SETUP_TOKEN}
      RUN_MIGRATIONS: "false"
    command: ["python", "-m", "app.cli", "cargar-demo", "--con-prediccion"]
    restart: "no"

volumes:
  inventia_datos:
